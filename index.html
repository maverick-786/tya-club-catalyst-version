var FQ=[['What happens in a typical TYA session?','Young adults meet in their Pod of about 30 with a coach and work through a Mission: a real-life scenario where they practise communicating, deciding and acting together. Exact session timings are being confirmed, so message us for the latest schedule.'],['What exactly will Young Adults (YA) learn at TYA?','Practical skills such as communication, collaboration, decision making, adaptability, ownership and confidence, learned through stories, roles and Missions.'],['Is TYA a coaching or tuition program?','TYA is an after-school club for life skills and mindset, not academic tuition. Skills are practised through experience, not taught from the front of a room.'],['As a Young Adult, will I have to speak or perform in front of everyone?','You take part in your own way. Pods are built so quiet, natural and in-between thinkers can all learn comfortably, and chances to speak come as you grow in confidence.'],['What if my child is shy or doesn\'t participate?','Belonging comes first. Pods are designed to feel safe and familiar, and coaches look for small steps in participation, which show up in the monthly Growth Card.'],['What is a TYA Pod?','A Pod is a supportive community of about 30 young adults guided by a coach.'],['How does TYA help beyond the sessions?','Parents see progress through coach observations, reflection and a monthly Growth Card, so the whole family can notice change.'],['How do you know whether a YA is actually growing?','TYA isn\'t about marks or grades. Growth can show up in how a young adult communicates, participates, takes responsibility, handles challenges, works with others, makes decisions and reflects on their experiences. We aim to make that growth visible through participation, reflection and a record of their journey.'],['What role do parents play in TYA?','Parents are important partners, but TYA is ultimately the young adult\'s space. We encourage parents to support the journey without taking ['What we collect','<ul><li><b>Information you give us:</b> your name, email address, WhatsApp or phone number and the message you write when you use the contact form, ask about a free trial, ask to be notified about a Pod, or message us on WhatsApp or by email.</li><li><b>Information about young people:</b> if a parent or guardian enquires on behalf of a young adult, we may ask for the young adult\'s first name, age or class, and city so we can suggest the right Pod.</li><li><b>Technical information:</b> like most websites, our host may record basic technical data such as IP address, browser type and pages visited, for security and to keep the site running.</li></ul>'],
['How we use it','<ul><li>To reply to your questions and arrange free trials.</li><li>To tell you about Pod locations, timings and openings near you.</li><li>To run the club safely and share progress with families, including the monthly Growth Card, once a young adult has joined.</li><li>To improve the website and our programmes.</li></ul>We do not sell personal information, and we do not use it for third-party advertising.'],
['Young people and parental consent','TYA serves young people, including people under 18. We ask for a parent or guardian\'s consent before collecting or using a minor\'s personal information, and we do not track or profile children or direct behavioural advertising at them. If you believe a young person has given us information without a parent or guardian\'s knowledge, please contact us and we will remove it.'],
['Photos and media','We take photographs or video at Pods only with the consent of parents or guardians (and of young adults who are old enough to give it). You can withdraw consent for future use at any time by contacting us. Images on this website are for illustration unless stated otherwise.'],
['Who we share it with','We share information only with people who help us run TYA, such as the coaches and team members who need it to respond to you, and service providers for email, messaging (such as WhatsApp), and website hosting. They may use it only to provide those services to us. We may also disclose information where the law requires it or to protect someone\'s safety.'],
['Third-party services and links','This website loads fonts from Google Fonts and links to our Facebook and Instagram pages and to WhatsApp. These services have their own privacy policies and may receive technical data such as your IP address when you use them.'],
['How long we keep it','We keep enquiry details for as long as needed to respond and to follow up about trials or Pod openings, and then delete or anonymise them. For enrolled families, we keep records for as long as the young adult takes part, and for a reasonable period afterwards, unless the law requires longer.'],
['Keeping it safe','We use reasonable technical and organisational measures to protect personal information and limit access to the people who need it. No online system is completely secure, so please do not send sensitive information such as passwords or financial details through the contact form.'],
['Your choices and rights','You can ask us to tell you what personal information we hold about you or your child, to correct it, to delete it, or to stop contacting you. You can also withdraw consent you have given. Write to us at the email below and we will respond within a reasonable time. If you are not satisfied, you may raise a complaint with the relevant data protection authority in India.'],
['Changes to this policy','We may update this policy from time to time. The date at the top shows when it was last changed.'],
['Contact us','Questions or requests about privacy: <a href="mailto:'+EM+'">'+EM+'</a>, or WhatsApp <a href="'+WA+'" '+EXT+'>+91 888 666 5295</a>.']];
var TERMS=[['About these terms','These terms apply when you use the TYA Club website and our communications. By using the site you agree to them. If you do not agree, please do not use the site. Joining a TYA Pod may have additional terms, which we will share when you enrol.'],
['What TYA is','TYA Club is an after-school club for life skills and mindset, not academic tuition. Skills such as communication, collaboration, decision making, adaptability and ownership are practised through experiences called Missions, in Pods of about 30 young adults guided by a coach.'],
['Free trials and enrolment','Free trials are offered subject to availability. Pod timings, trial days, fees and batch sizes are confirmed directly by our team and may change. Nothing on this website is a binding offer until we confirm it with you in writing, including by email or WhatsApp.'],
['Young adults, parents and guardians','Young adults under 18 must have a parent or guardian\'s permission to join, and the parent or guardian is responsible for providing accurate contact details and for the young person\'s attendance, travel and conduct. Parents are welcome to sit in on a trial session.'],
['Respectful conduct','We ask everyone in a TYA space to be respectful and safe. We may ask a participant to leave a session, or end a membership, if their behaviour puts others at risk or repeatedly disrupts the group.'],
['Progress and results','Coach observations, Growth Cards and other updates describe real progress and what to work on next. They are observations, not exam marks or grades, and we do not guarantee any particular result, admission, job or income. Stories on this website are either shared with permission or labelled as composite blends of several families\' experiences.'],
['Photos and media','We use photos and video of Pod activities only with consent, as described in our <a href="#privacy">Privacy Policy</a>. Images on this website are for illustration unless stated otherwise.'],
['Our content','The TYA name, logo, text, graphics and programme materials belong to TYA Club or its licensors. You may view and share pages of this site for personal, non-commercial use. Please ask us before copying or reusing our material for any other purpose.'],
['Franchise and partnership enquiries','Information about partnering with TYA is an invitation to talk, not an offer to grant a franchise. Any partnership will be governed only by a separate written agreement that both sides have signed.'],
['Links and third parties','Our site links to services we do not control, such as WhatsApp, Facebook and Instagram. We are not responsible for their content or practices.'],
['Disclaimers and liability','We work to keep this website accurate and available, but we provide it "as is" and cannot promise it will always be free of errors or interruptions. To the extent the law allows, TYA Club is not liable for indirect or consequential loss arising from use of the website. Nothing in these terms limits liability that cannot be limited by law.'],
['Changes','We may update these terms from time to time. Continuing to use the site after a change means you accept the updated terms.'],
['Governing law','These terms are governed by the laws of India. Disputes will be subject to the courts at Hyderabad, Telangana, unless the law provides otherwise.'],
['Contact us','Questions about these terms: <a href="mailto:'+EM+'">'+EM+'</a>, or WhatsApp <a href="'+WA+'" '+EXT+'>+91 888 666 5295</a>.']];

function story(){
var f=[['Founder','Kiran Babu P.','A TEDx speaker, life-skills coach, management trainer, business architect, author and serial entrepreneur with a 27-year career across India, the US and Europe. Six Sigma Black Belt and Certified Networker. His ventures cover business networking, growth support for entrepreneurs and startups, and life-skills development for young adults.','A lifelong learner and builder, Kiran started TYA after years of listening to young people across cities, driven by a simple belief — every young person deserves the right support to thrive.'],['Co-founder','Anoop Jaju','An entrepreneur and business leader with an MBA from SP Jain Institute of Management and Research, Mumbai, and over 25 years of experience. He leads a group with interests in textiles, recruitment, real estate and solar energy. Through NIA Surat and TYA Club he focuses on entrepreneurial communities and young adult development.','Anoop brings a passion for people, partnerships and programs. He loves creating meaningful experiences that help young people explore, connect and grow with confidence.'],['Co-founder','Sreyansh Jain','An entrepreneur and growth strategist with over a decade of experience in leadership, innovation and execution, across business development, team building and systems thinking. At TYA he works on closing the gap between academic learning and real-world readiness.','Sreyansh is energised by ideas, technology and impact. He focuses on building scalable solutions that make quality learning and mentorship more accessible to young people everywhere.']];
var pv=[['Belong before you lead','Pods provide the safety and familiarity young adults need to take part in their own way.'],['Make skills feel useful','Missions give communication, judgment and ownership a real purpose.'],['Keep parents in the loop','Progress is shown through coach observations, reflection and a monthly Growth Card.']];
return shell('our-story','dk tb',`<div class="w g c2 hero sth"><div><span class="tag hand">Our story</span><h1 class="hl">${HL('began','Where <em>TYA</em> began.',640)}</h1><img class="tbu" src="assets/underline-yellow.webp" alt="" aria-hidden="true"><p>What if young adults had a space to learn the things that classrooms often don't teach?</p><p>Kiran Babu P. conceived the concept after nearly a decade of research and conversations across several cities. Anoop Jaju and Sreyansh Jain joined, reshaped the idea and named it TYA Club: Transforming Young Adults.</p></div><div class="stp">${ph('story','Young people in animated conversation','t hm')}<div class="n2 stn">Real people.<br>Bigger possibilities.</div></div></div>`)+
sec(`<div class="stg"><div class="stw">${ph('story2','Friends overlooking the city at sunset','sw hm2')}</div><div><h2 class="hl">${HL('theymeet','They meet. <em>They question.</em> They become.',690)}</h2><p class="hand">A room for the person they are becoming.</p><p>TYA is a space where young adults interact, experiment, reflect and learn from each other, not just from someone at the front of a room. The mission is to close the gap between knowing and doing through hands-on activities, games, discussions and peer learning, building independent thinking, communication, emotional intelligence, leadership and entrepreneurship.</p></div></div>`)+
sec(`<h2 class="stpb hl">${HL('people','The people <em>behind the movement.</em>',650)}</h2><div class="fdg">${f.map((p,i)=>`<div class="fdc"><div class="fdp">${ph('f'+i,p[1],'fd')}</div><div><span class="tag hand" style="${i%2?'background:var(--c);color:#fff':''}">${p[0]}</span><h3>${p[1]}</h3><p>${p[3]}</p><details class="rm"><summary>Read more</summary><p>${p[2]}</p></details></div></div>`).join('')}</div><p style="font-size:13px;color:var(--mut);margin-top:12px">Founder portraits are stylised illustrations.</p>`)+
sec(`<h2>Confidence is not a personality trait. <em>It is a practice.</em></h2><div class="g cards" style="margin-top:22px">${pv.map((p,i)=>`<div class="cd ${i%2?'r':'y'}"><h3>${p[0]}</h3><p>${p[1]}</p></div>`).join('')}</div>`,'','dk bnd')+
sec(`<div class="g c2"><div class="cta"><h2>Give them one hour to try.</h2><p>Meet the coach, see a Mission in action, and decide after the young adult has experienced the space.</p>${btn('See the parent view','parents')}</div><div class="cta r"><h2 style="color:#fff">Find your nearest TYA Pod.</h2><p>Enter a city, locality or PIN code to find locations.</p>${btn('Find your Pod','centre-results','o')}</div></div>`)}
function franchise(){
var J=[['Discover','Explore the TYA purpose, experience and opportunity in your city.'],['Find the fit','Discuss your community, partner profile and practical foundations.'],['Plan','Shape the centre, team and thoughtful local launch pathway.'],['Prepare','Complete training, operations and community outreach together.'],['Launch','Welcome the first families and begin the local TYA journey.']];
return shell('franchise','dk tb',`<div class="w g c2 hero frhd"><div><span class="tag hand">Bring TYA to your city</span><h1 class="hl">${HL('room','Start a room where <em>young adults become.</em>',650)}</h1><img class="tbu" src="assets/underline-yellow.webp" alt="" aria-hidden="true"><div class="frrow"><img class="frm2" src="assets/map-india.webp" alt="Hand-drawn map of India with pins at Hyderabad, Surat, Delhi and Chennai"><div class="frcol"><p>Join a thoughtful network of partners creating practical, confidence-building experiences for the next generation.</p><p>${btn('Explore the partnership →','fj','y')}${btn('Start a conversation','contact','o')}</p></div></div></div><div class="frh">${ph('city','Friends talking on a rooftop at sunset','t hm')}<img class="frm" src="assets/map-india.webp" alt="Hand-drawn map of India with pins at Hyderabad, Surat, Delhi and Chennai"><p class="hand note">One city. One committed partner. Many possibilities.</p></div></div>`)+
sec(`<h2>From first conversation to <em>opening day.</em></h2><p>A guided path helps both sides understand the fit, prepare thoughtfully and build with confidence.</p><div class="g cards steps five" style="margin-top:22px">${J.map((t,i)=>`<div class="cd ${i%2?'r':'y'}"><span class="n"><img src="assets/num-0${i+1}.webp" alt="0${i+1}"></span><h3>${t[0]}</h3>${ph('j'+i,t[0],'s jm')}<p>${t[1]}</p></div>`).join('')}</div>`,'fj','bnd-t bnd')+
sec(`<div class="fpr"><div class="cd r fpn" style="padding:28px"><span class="tag hand">The right partner</span><h2 style="color:#fff">“Someone who believes young adults deserve <span style="color:var(--y)">better spaces to grow.”</span></h2>${ph('partner','Two young partners planning a launch together','pt')}</div><div class="fpm"><h2>Could this be <em>you?</em></h2><p class="hand">Purpose, people and the drive to build well.</p><p>We look for thoughtful local leaders who understand their communities and care about creating a meaningful learning experience.</p><div class="trs">${[['people','Community-minded'],['chart','Entrepreneurial'],['people','People-focused'],['book','Ready to learn'],['sprout','Build with support']].map((p,i)=>`<div class="tr"><span class="trc ${i%2?'r':'y'}">${ic(p[0])}</span><b>${p[1]}</b></div>`).join('')}</div></div><div class="cd y fpc"><h2>Let's explore whether the partnership fits.</h2><p>${btn('Explore the partnership →','fj','k')}</p><p>${btn('Start a conversation','contact','o')}</p></div></div>`)+
sec(`<div class="g c2 fsr"><div><h2>A shared standard. <em>A locally rooted community.</em></h2><p style="max-width:62ch">The first conversation covers the brand, programme delivery, coach preparation, parent experience and the practical foundations of building TYA in your city.</p><p>${btn('Talk on WhatsApp',wa('Hi TYA, I would like to explore a franchise partnership.'),'o',EXT)}</p></div>${ph('partnerCta','Five young people smiling together at sunset','pc3 hm2')}</div>`,'','dk bnd')+pods()}
